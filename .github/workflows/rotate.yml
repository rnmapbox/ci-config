name: Rotate Mapbox tokens

on:
  schedule:
    # Mondays and Thursdays, 06:00 UTC
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rotate CI token
        run: ./scripts/rotate-mapbox-token.sh ci
        env:
          MAPBOX_ADMIN_TOKEN: ${{ secrets.MAPBOX_ADMIN_TOKEN }}
          MAPBOX_USERNAME: ${{ vars.MAPBOX_USERNAME }}

      # !cancelled() keeps each token rotating and committed when the other kind fails;
      # the job still goes red so the failure is noticed.
      - name: Rotate Snack token
        if: ${{ !cancelled() }}
        run: ./scripts/rotate-mapbox-token.sh snack
        env:
          MAPBOX_ADMIN_TOKEN: ${{ secrets.MAPBOX_ADMIN_TOKEN }}
          MAPBOX_USERNAME: ${{ vars.MAPBOX_USERNAME }}

      - name: Commit rotated tokens
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mapbox-*-token.*
          git diff --cached --quiet && exit 0
          git commit -m "rotate mapbox tokens"
          git push
