name: Rotate CI Mapbox token

on:
  schedule:
    # Mondays and Thursdays, 06:00 UTC
    - cron: '0 6 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug scope isolation
        run: |
          API="https://api.mapbox.com/tokens/v2/${MAPBOX_USERNAME}"
          for scope in styles:tiles styles:read fonts:read; do
            echo "--- testing [\"$scope\"] ---"
            resp=$(curl -sS -X POST "${API}?access_token=${MAPBOX_ADMIN_TOKEN}" \
              -H 'Content-Type: application/json' \
              -d "{\"note\":\"debug-scope-test\",\"scopes\":[\"$scope\"]}" \
              -w $'\n%{http_code}')
            code=$(tail -n1 <<< "$resp")
            body=$(sed '$d' <<< "$resp")
            echo "HTTP $code: $body"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              id=$(jq -r .id <<< "$body")
              curl -sS -X DELETE "${API}/${id}?access_token=${MAPBOX_ADMIN_TOKEN}" > /dev/null
              echo "(cleaned up test token $id)"
            fi
          done
        env:
          MAPBOX_ADMIN_TOKEN: ${{ secrets.MAPBOX_ADMIN_TOKEN }}
          MAPBOX_USERNAME: ${{ vars.MAPBOX_USERNAME }}
